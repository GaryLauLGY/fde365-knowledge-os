version: 2
root: .
update_source: https://fdekb.garylau.ai/plugin/latest.json

libraries:
  owner: 1-个人说明书
  product: 2-产品库
  customer: 3-客户需求库
  case: 4-素材案例库
  method: 5-方法论库
  content: 6-内容生产

inbox:
  pending: 0-待处理材料/待处理
  processed: 0-待处理材料/已处理记录

runtime:
  state: .fde/state
  indexes: .fde/indexes
  logs: .fde/logs
  versions: .fde/versions
  reports: .fde/reports
  quarantine: .fde/quarantine

policy:
  preserve_raw_files: true
  require_source_on_write: true
  allow_cross_project_read: false
  confirm_before_delete: true
