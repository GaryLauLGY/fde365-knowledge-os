version: 1
root: .
update_source: https://github.com/ozrwayne/kb-suite

libraries:
  owner: 1-老板说明书
  product: 2-产品库
  customer: 3-客户需求库
  case: 4-素材案例库
  method: 5-方法论库
  content: 6-内容生产

inbox:
  recordings: 0-录音处理/待处理录音
  processed: 0-录音处理/已处理

runtime:
  state: .kb/state
  indexes: .kb/indexes
  logs: .kb/logs
